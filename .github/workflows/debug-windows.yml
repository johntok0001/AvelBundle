name: Debug Windows installer (temporary)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run whose plugin builds to reuse
        required: true
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: win-*
          path: tars
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Unpack plugins
        shell: bash
        run: |
          mkdir -p art
          for t in tars/*.tar; do tar -xf "$t" -C art; done
      - name: Make installer
        shell: pwsh
        run: |
          python tools/gen.py windows art build\win
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc build\win\AvelBundle.iss *>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content iscc.log | Where-Object { $_ -notmatch '^\s*(Parsing|Reading|Compressing|Compiling|Preparing|Updating|Determining)' } | Select-Object -Last 25) -join '%0A'
            Write-Host "::error title=Inno Setup::$msg"
            exit 1
          }
      - name: Test installer
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Avel-Bundle-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $plugins = Get-Content plugins.json -Raw | ConvertFrom-Json
          foreach ($p in $plugins) {
            $f = "$env:CommonProgramFiles\VST3\$($p.product).vst3\Contents\x86_64-win\$($p.product).vst3"
            if (-not (Test-Path $f)) { Write-Host "::error::$($p.product) not installed"; exit 1 }
          }
          Write-Host "::notice::All plugins installed"
